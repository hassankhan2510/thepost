name: 🎯 Opportunity Radar

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 8:00 AM PKT (3:00 AM UTC)
  workflow_dispatch: {}    # Manual trigger anytime from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run Opportunity Radar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          DISCORD_RADAR_WEBHOOK: ${{ secrets.DISCORD_RADAR_WEBHOOK }}
        run: node scripts/opportunity_radar.mjs

      - name: 📁 Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-report-${{ github.run_id }}
          path: |
            out/opportunity_report.md
            out/opportunities_raw.json
          if-no-files-found: ignore
          retention-days: 30
