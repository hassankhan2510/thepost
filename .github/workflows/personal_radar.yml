name: 🎯 Personal Radar v2

on:
  schedule:
    - cron: '0 3 * * *'    # Daily at 8:00 AM PKT (3:00 AM UTC)
  workflow_dispatch: {}     # Manual trigger from the GitHub UI

permissions:
  contents: write           # needed to commit radar_seen.json + raw data back

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run Personal Radar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Search backend — set EITHER Brave (recommended, whole-web) OR Google CSE (domain-restricted).
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          DISCORD_RADAR_WEBHOOK: ${{ secrets.DISCORD_RADAR_WEBHOOK }}
          DISCORD_ROLES_WEBHOOK: ${{ secrets.DISCORD_ROLES_WEBHOOK }}
          # Optional overrides:
          # RADAR_DORK_COUNT: '45'
          # RADAR_DATE_RESTRICT: 'd7'
          # RADAR_LLM_MODEL: 'openrouter/free'
        run: node scripts/personal_radar.mjs

      - name: 💾 Commit radar memory & raw data
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/radar_seen.json data/radar_raw_*.json out/radar_items.json 2>/dev/null || true
          git commit -m "Radar: update memory + raw scrape ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: 📁 Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-radar-${{ github.run_id }}
          path: |
            data/radar_raw_latest.json
            out/radar_items.json
          if-no-files-found: ignore
          retention-days: 30
