name: Cohort Zero Daily Run

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Custom topic/headline (leave blank to auto-fetch RSS)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Node dependencies
        run: npm ci
        
      - name: Install system dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libgbm-dev
          
      - name: Ensure Remotion Browser
        run: npx remotion browser ensure
        
      - name: Fetch News & Generate Content
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_TOPIC: ${{ inputs.custom_topic }}
        run: npm run fetch
        
      - name: Generate Assets
        run: npm run assets
        
      - name: Wrap Props for Remotion
        run: npm run wrap-props
        
      - name: Render Cohort Zero Graphic
        run: npm run render:cohortzero
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-posts
          path: |
            out/
            data/script.json
            data/thread.json
            
      - name: Commit Updated History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/history.json
          git commit -m "Auto-update history.json" || echo "No changes to commit"
          git push

